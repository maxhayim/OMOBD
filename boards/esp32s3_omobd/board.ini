; boards/esp32s3_omobd/board.ini — OMOBD build for ESP32-S3 (Wi-Fi dashboard + BLE).
; Same hardware facts as boards/esp32s3 plus OMOBD's web dashboard.
; The platform is pinned: the unpinned `espressif32` resolves to 8.x
; (Arduino-ESP32 3.x / IDF 5), which preOBD has not been validated on.

[env:esp32s3_omobd]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -include boards/esp32s3_omobd/board.h
    -include boards/resolve.h
    ${esp32s3_omobd.wiring}
    -D ESP32
    -D CONFIG_IDF_TARGET_ESP32S3
    -O2
    -Wall
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/omobd_embed_dashboard.py
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
    https://github.com/avinabmalla/ESP32_BleSerial.git#v1.0.4

[esp32s3_omobd]
wiring =
